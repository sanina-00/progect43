{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">

</head>
<body>

    <aside>
        <img src="{% static 'main/img/pinterest.png' %}" alt="logo">
        <span class = 'logo'>Pinterest</span>
        <h3>Навигация</h3>
        <h1>   </h1>
        <ul>
            <a href="{% url 'home' %}"><li><i class="fa-solid fa-house"></i>Главная</li></a>
            <a href="{% url 'about' %}"><li><i class="fa-solid fa-hand"></i>Про нас</li></a>
            <a href="/pronas"><li><i class="fa-solid fa-comment"></i>Контакты</li></a>
            <a href="{% url 'news_home' %}"><li>Новости</li></a>
        </ul>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
